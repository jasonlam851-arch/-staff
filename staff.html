<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店員控制面板</title>
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
        }
      }
    </script>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #edf2f7; padding: 20px; }
        h1 { text-align: center; color: #2d3748; margin-bottom: 20px; }
        .panel { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .panel-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 2px solid; }
        .title-a { color: #3182ce; border-color: #3182ce; }
        .title-b { color: #dd6b20; border-color: #dd6b20; }
        .title-c { color: #38a169; border-color: #38a169; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 15px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-next { background-color: #48bb78; }
        .btn-recall { background-color: #a0aec0; }
        .status-txt { font-size: 1rem; color: #4a5568; line-height: 1.6; }
        .btn-reset { background-color: #e53e3e; width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px; border: none; color: white; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🏪 店員叫號控制面板</h1>

    <div class="panel">
        <div class="panel-title title-a">🧍 A組 (1人)</div>
        <div class="btn-group">
            <button class="btn-next" onclick="nextNum('A')">🔔 叫下一位</button>
            <button class="btn-recall" onclick="recallNum('A')">🔄 重呼</button>
        </div>
        <div class="status-txt">當前叫號：<b id="callA">A---</b> | 已取號總數：<span id="totalA">0</span></div>
    </div>

    <div class="panel">
        <div class="panel-title title-b">👨‍👦 B組 (2-3人)</div>
        <div class="btn-group">
            <button class="btn-next" onclick="nextNum('B')">🔔 叫下一位</button>
            <button class="btn-recall" onclick="recallNum('B')">🔄 重呼</button>
        </div>
        <div class="status-txt">當前叫號：<b id="callB">B---</b> | 已取號總數：<span id="totalB">0</span></div>
    </div>

    <div class="panel">
        <div class="panel-title title-c">👨‍👩‍👧‍👦 C組 (4-5人)</div>
        <div class="btn-group">
            <button class="btn-next" onclick="nextNum('C')">🔔 叫下一位</button>
            <button class="btn-recall" onclick="recallNum('C')">🔄 重呼</button>
        </div>
        <div class="status-txt">當前叫號：<b id="callC">C---</b> | 已取號總數：<span id="totalC">0</span></div>
    </div>

    <button class="btn-reset" onclick="resetAll()">⚠️ 全體數據清零重置</button>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, set, onValue } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyDwUF4-rBRG9QGyti2_Smx_PRZ8sZOZL0A",
            authDomain: "my-queue-system-3bcc5.firebaseapp.com",
            databaseURL: "https://my-queue-system-3bcc5-default-rtdb.firebaseio.com",
            projectId: "my-queue-system-3bcc5",
            storageBucket: "my-queue-system-3bcc5.firebasestorage.app",
            messagingSenderId: "32354532851",
            appId: "1:32354532851:web:4ba48fcc31bb454399a686"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let systemData = {};

        // 監聽數據
        onValue(ref(db, 'queueSystem'), (snapshot) => {
            systemData = snapshot.val() || {};
            ['A', 'B', 'C'].forEach(type => {
                const called = systemData[type]?.currentCalled || 0;
                const total = systemData[type]?.totalIssued || 0;
                
                document.getElementById(`call${type}`).innerText = called > 0 ? type + String(called).padStart(3, '0') : type + "---";
                document.getElementById(`total${type}`).innerText = total;
            });
        });

        // 叫下一位
        window.nextNum = function(type) {
            const current = systemData[type]?.currentCalled || 0;
            const total = systemData[type]?.totalIssued || 0;
            if (current < total) {
                set(ref(db, `queueSystem/${type}/currentCalled`), current + 1);
            } else {
                alert(`${type}組 目前沒有客人在排隊！`);
            }
        };

        // 重呼
        window.recallNum = function(type) {
            const current = systemData[type]?.currentCalled || 0;
            if (current > 0) {
                // 透過重寫一次雲端引發 screen.html 再次發聲
                set(ref(db, `queueSystem/${type}/currentCalled`), current); 
            } else {
                alert(`${type}組 尚未開始叫號！`);
            }
        };

        // 重置
        window.resetAll = function() {
            if (confirm("確定要將所有 A、B、C 組數據全部清零重置嗎？")) {
                set(ref(db, 'queueSystem'), {
                    A: { currentCalled: 0, totalIssued: 0 },
                    B: { currentCalled: 0, totalIssued: 0 },
                    C: { currentCalled: 0, totalIssued: 0 }
                });
            }
        };
    </script>
</body>
</html>
